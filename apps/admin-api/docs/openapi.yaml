openapi: 3.1.0
info:
  title: SCORETech Identity Admin API
  version: 0.1.0
  description:
    Administrative identity API for SCORETech Identity. Protected /v1 operations require a
    signed user access token for audience identity-admin-api, an allowed client (identity-admin-web
    by default), a current session, admin-web:{environment}:access and server-attested passkey
    authentication. Each operation additionally checks its atomic permissions and current delegation
    authority. A generic administrator role is not a second service-entry requirement. Sensitive
    support actions require recent passkey verification. Account self-service belongs to Account
    API. Catalogue edits are versioned desired configuration; assignment roles come from the
    verified applied projection.
servers:
  - url: /identity/api/admin
    description: Public prefix for the default /identity deployment. Configure the prefix with the
      deployment base path.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: get_health
      summary: Read process health
      tags:
        - Operations
      description: Public process-health endpoint. It does not authenticate a user or probe upstream
        availability.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
                  service:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - service
                  - version
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /healthcheck:
    get:
      operationId: get_healthcheck
      summary: Read process health
      tags:
        - Operations
      description: Public process-health endpoint. It does not authenticate a user or probe upstream
        availability.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
                  service:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - service
                  - version
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /ready:
    get:
      operationId: get_ready
      summary: Read process health
      tags:
        - Operations
      description: Public process-health endpoint. It does not authenticate a user or probe upstream
        availability.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
                  service:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - service
                  - version
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /metrics:
    get:
      operationId: get_metrics
      summary: Read Prometheus metrics
      tags:
        - Operations
      description: Public Prometheus metrics endpoint.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /v1/applications:
    get:
      operationId: get_v1_applications
      summary: List managed OIDC applications
      tags: [applications]
      description: >-
        Requires identity:roles:manage in both the signed token and current effective permissions,
        plus current membership in the protected administrador role. Returns managed application
        metadata and public OIDC discovery references. Client secrets and unrelated provider fields
        are never included. Unmanaged Keycloak clients are outside this API.
      responses:
        '200':
          description: Managed applications and public integration metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        default:
          description: Authorization or upstream failure. Provider diagnostics and credentials are withheld.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
    post:
      operationId: post_v1_applications
      summary: Register a managed OIDC application
      tags: [applications]
      description: >-
        Creates an authorization-code application with PKCE S256 and a server-generated
        score-app- client ID. Public browser clients receive no client secret; confidential
        server clients receive their initial secret in this response. Reading an existing
        confidential secret requires the separate authorized reveal operation. The kind can later
        be changed through a versioned update. Requires the same signed and current management authority and protected
        administrator membership as listing. The user's bearer is forwarded to the provider;
        request fields cannot choose a provider URL, client ID or credentials. This is an
        authenticated administrative operation, not dynamic client registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSettings'
      responses:
        '201':
          description: Created application, with an initial confidential client secret when applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreatedResponse'
        default:
          description: Validation, authorization, conflict or upstream failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
  /v1/applications/{clientId}:
    put:
      operationId: put_v1_applications_clientId
      summary: Replace managed application settings
      tags: [applications]
      description: >-
        Replaces settings for an existing managed client, including its kind and enabled state. Supply
        the current UUID version from the last read or mutation; a stale version conflicts.
        The client ID remains stable when switching between public and confidential. Requires signed and current
        identity:roles:manage plus the live protected administrador role. Changing kind clears previous credentials; conversion to confidential
        returns a fresh clientSecret. Ordinary updates never return an existing secret, and public
        applications never return one. A kind change revokes affected online and offline SSO user
        sessions. Those sessions can include other applications, so users may need to authenticate again.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ManagedApplicationClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Updated application and version, with a fresh secret when converting to confidential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMutationResponse'
        '409':
          description: Stale version or conflicting provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Validation, authorization, missing managed client or upstream failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
    delete:
      operationId: delete_v1_applications_clientId
      summary: Delete a managed OIDC application
      tags: [applications]
      description: >-
        Permanently removes an existing managed application using its current UUID version.
        Requires signed and current identity:roles:manage, current protected administrador
        membership, a current user session and server-attested passkey authentication.
        A stale version conflicts; native/system clients and clients outside application ownership
        cannot be deleted here. User accounts and realm roles are retained. The application's
        online and offline client sessions are removed while unrelated SSO sessions remain.
        Access tokens validated offline can remain valid until their configured expiry.
        The response confirms only the requested client ID and deleted: true; audit records
        identify the operator and client without recording credential values.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ManagedApplicationClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionRequest'
      responses:
        '200':
          description: Managed application deleted; confirmation is bound to the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDeletionResponse'
        '404':
          description: The managed application does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The current application version differs from the submitted version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Validation, authorization or upstream failure. No credential values are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
  /v1/applications/{clientId}/secret:
    post:
      operationId: post_v1_applications_clientId_secret
      summary: Rotate a confidential application's secret
      tags: [applications]
      description: >-
        Rotates the credential of an existing managed confidential application and returns the
        new secret in the response. Use the separate reveal operation to read the current secret
        without changing it. Public applications have no secret to rotate. Supply the current UUID
        version; stale versions conflict. Requires signed and current identity:roles:manage plus
        current protected administrator membership. The returned application and clientId are
        bound to the path ID. Secrets are excluded from application lists, ordinary updates without a kind change and
        audit metadata.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ManagedApplicationClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionRequest'
      responses:
        '200':
          description: New credential and updated confidential application metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretResponse'
        '409':
          description: Stale version or an application kind that has no rotatable secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Validation, authorization, missing managed client or upstream failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
  /v1/applications/{clientId}/secret/reveal:
    post:
      operationId: post_v1_applications_clientId_secret_reveal
      summary: Reveal the current confidential application secret
      tags: [applications]
      description: >-
        Explicitly returns the existing secret of a managed confidential application. Requires
        signed and current identity:roles:manage, current protected administrador membership,
        a current user session and server-attested passkey authentication. Supply the current
        UUID version; stale versions and public clients conflict. This operation does not rotate
        credentials, change application settings or advance the version. The response contains
        only clientId, clientSecret and the same version; no application view is returned.
        Secrets remain absent from GET lists and ordinary updates. Responses are not cacheable,
        and audit records identify the operator and client without recording the secret value.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ManagedApplicationClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionRequest'
      responses:
        '200':
          description: Existing confidential credential and unchanged current version.
          headers:
            Cache-Control:
              description: Prevents storage of the revealed credential.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretRevealResponse'
        '409':
          description: Stale application version or a public client without a revealable secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Validation, authorization, missing managed client or upstream failure. No secret is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions: [identity:roles:manage]
      x-live-protected-role: administrador
  /v1/step-up:
    post:
      operationId: post_v1_step_up
      summary: Start recent identity verification for a support action
      tags:
        - step-up
      description:
        Starts a provider-issued verification ticket for the current signed-in operator and an
        allowed origin. The scope is restricted to credential removal or deactivation of the
        specified user; the user bearer is forwarded, never service credentials.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
                  expiresAt:
                    type: number
                required:
                  - ticket
                  - expiresAt
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  pattern: ^user:[a-f0-9-]{36}:(credentials|deactivate)$
                origin:
                  type: string
                  format: uri
              required:
                - scope
                - origin
              additionalProperties: false
      x-entry-permission: admin-web:{environment}:access
  /v1/catalogue:
    get:
      operationId: get_v1_catalogue
      summary: Read desired catalogue and its base revision
      tags:
        - catalogue
      description: Reads the versioned editor source for this console environment. This is desired
        configuration; user assignments use the verified applied projection. Another environment is
        rejected. The capabilities object is derived by the server from the current protected
        identity-administrator role; it is not client-supplied authority. Publication still requires
        its operation permission and current delegation checks.
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum:
              - local
              - staging
              - production
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueRead'
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:view
  /v1/catalogue/snapshots/{environment}/{revision}:
    get:
      operationId: get_v1_catalogue_snapshots_environment_revision
      summary: Read a verified immutable catalogue snapshot
      tags:
        - catalogue
      description:
        Reads the immutable snapshot only after checking its revision digest and configured
        environment. It does not assert that the snapshot is currently applied.
      parameters:
        - name: environment
          in: path
          required: true
          schema:
            type: string
            enum:
              - local
              - staging
              - production
        - name: revision
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalogue:
                    $ref: '#/components/schemas/CatalogueSchema'
                required:
                  - catalogue
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:view
  /v1/catalogue/validate:
    post:
      operationId: post_v1_catalogue_validate
      summary: Validate a proposed authorization catalogue
      tags:
        - catalogue
      description: >-
        Validates the proposed catalogue for this console environment without publishing it.
        Existing atomic permission names, service namespace ownership and descriptions are immutable:
        removal, renaming and replacement are rejected. A current protected identity administrator
        can append application permissions and change application access rules. Reserved identity
        namespaces cannot be used for new permissions. Delegated role edits remain bounded by the
        operator's signed and current permissions; publication checks these again.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    const: true
                required:
                  - valid
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalogue:
                  $ref: '#/components/schemas/CatalogueSchema'
                environment:
                  type: string
                  enum:
                    - local
                    - staging
                    - production
              required:
                - catalogue
              additionalProperties: false
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:manage
  /v1/catalogue/revisions:
    post:
      operationId: post_v1_catalogue_revisions
      summary: Publish a desired catalogue revision
      tags:
        - catalogue
      description: >-
        Writes one versioned desired revision for the configured environment with optimistic
        concurrency, current delegation checks and audit metadata. Conflicting base revisions return
        409. Changes and audit history become effective in one database transaction. Adding atomic
        permissions or changing accessRules additionally requires the live protected administrador
        role. Existing permissions cannot be removed, renamed, reassigned to another service
        namespace or have their description changed. The server derives the protected administrator
        role's references from all declared atoms; callers must not use this operation to customize
        that role. Ordinary delegated role/group edits retain their signed-and-live authority bounds.
        The response is a saved desired revision, not proof of application: poll catalogue/environments
        for state applied and observedRevision equal to revision.revisions for this environment.
      responses:
        '201':
          description: Catalogue and authorization applied atomically with their database audit entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/CatalogueOperation'
                required:
                  - revision
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseSha:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                catalogue:
                  $ref: '#/components/schemas/CatalogueSchema'
                reason:
                  type: string
                  minLength: 8
                  maxLength: 300
                environments:
                  type: array
                  items:
                    type: string
                    enum:
                      - local
                      - staging
                      - production
                  minItems: 1
                  maxItems: 1
                  x-runtime-refinement: true
                sourceEnvironment:
                  type: string
                  enum:
                    - local
                    - staging
                    - production
              required:
                - baseSha
                - catalogue
                - reason
                - environments
              additionalProperties: false
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:manage
    get:
      operationId: get_v1_catalogue_revisions
      summary: List audited database catalogue operations
      tags:
        - catalogue
      description:
        Identity operation. SCORETech Identity enforces input validation and the operation-specific
        permissions.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogueOperation'
                required:
                  - revisions
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:view
  /v1/catalogue/rollbacks:
    post:
      operationId: post_v1_catalogue_rollbacks
      summary: Publish a desired rollback revision
      tags:
        - catalogue
      description:
        Writes one versioned desired revision for the configured environment with optimistic
        concurrency, current delegation checks and audit metadata. Conflicting base revisions return
        409. Changes and audit history become effective in one database transaction.
      responses:
        '201':
          description: Catalogue and authorization applied atomically with their database audit entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/CatalogueOperation'
                required:
                  - revision
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseSha:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                operationId:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                environments:
                  type: array
                  items:
                    type: string
                    enum:
                      - local
                      - staging
                      - production
                  minItems: 1
                  maxItems: 1
                  x-runtime-refinement: true
                reason:
                  type: string
                  minLength: 8
                  maxLength: 300
              required:
                - baseSha
                - operationId
                - environments
                - reason
              additionalProperties: false
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:manage
  /v1/catalogue/environments:
    get:
      operationId: get_v1_catalogue_environments
      summary: Read desired and observed catalogue application status
      tags:
        - catalogue
      description:
        Returns this console environment only. Applied means the database contains the
        active database revision. Successful saves are immediately applied and audited.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      $ref: '#/components/schemas/CatalogueStatus'
                required:
                  - environments
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:roles:view
  /v1/invitations:
    post:
      operationId: post_v1_invitations
      summary: Create a role-bound invitation
      tags:
        - invitations
      description: Creates an invitation for existing roles within the operator's signed and current
        delegation authority. The returned link must belong to the configured issuer and
        environment. Validation errors may include error.fields.
      responses:
        '201':
          description: Created resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/InvitationSchema'
                  link:
                    type: string
                    format: uri
                required:
                  - invitation
                  - link
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 150
                roles:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 150
                  minItems: 1
                  maxItems: 50
                  x-runtime-refinement: true
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100000
                expiresAt:
                  anyOf:
                    - type: integer
                      exclusiveMinimum: 0
                    - type: 'null'
                  x-runtime-refinement: true
              required:
                - name
                - roles
                - limit
              additionalProperties: false
      x-entry-permission: admin-web:{environment}:access
      x-required-permissions:
        - identity:invitations:create
        - identity:users:update:roles
    get:
      operationId: get_v1_invitations
      summary: List invitations
      tags:
        - invitations
      description:
        Identity operation. SCORETech Identity enforces input validation and the operation-specific
        permissions.
      parameters:
        - name: first
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: max
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - expired
              - revoked
              - exhausted
              - blocked
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvitationSchema'
                required:
                  - invitations
        default:
          description: Validation, authorization, conflict or dependency failure. See error.code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
