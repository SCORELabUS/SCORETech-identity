        roles:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 150
                pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
              description:
                type: string
                maxLength: 500
                default: ''
              permissions:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 150
                  pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
                maxItems: 2000
            required:
              - name
              - permissions
            additionalProperties: false
          minItems: 1
          maxItems: 250
        groups:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 150
                pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
              roles:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 150
                  pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
                maxItems: 250
            required:
              - name
              - roles
            additionalProperties: false
          maxItems: 250
        accessRules:
          type: array
