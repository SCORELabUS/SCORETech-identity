components:
  schemas:
    ManagedApplicationClientId:
      type: string
      pattern: ^score-app-[a-f0-9-]{36}$
      description: Server-generated identifier of a client managed by SCORETech Identity.
      example: score-app-11111111-1111-4111-8111-111111111111
    ApplicationVersion:
      type: string
      format: uuid
      description: Opaque UUID version used for optimistic concurrency, never a numeric revision.
    ApplicationOrigin:
      type: string
      format: uri
      maxLength: 2048
      description: >-
        Exact canonical HTTPS origin without a path, trailing slash, query, fragment, credentials
        or wildcards. HTTP is allowed only for exact localhost or 127.0.0.1 origins in the local
        environment. Ports are significant except that default ports must be omitted.
      example: https://research.score.example
      x-runtime-refinement: Canonical origin and environment-specific HTTPS checks apply server-side.
    ApplicationPermission:
      type: string
      minLength: 3
      maxLength: 160
      not:
        pattern: '^(identity|admin-web|account-web):'
      description: Existing atomic application permission; protected identity namespaces are excluded.
      example: sphere:read
      x-runtime-refinement: The provider verifies that each permission is an eligible active atomic role.
    ApplicationFields:
      type: object
      description: Shared fields for managed application input and metadata.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Human-readable application name; leading and trailing whitespace is trimmed.
        kind:
          type: string
          enum: [public, confidential]
          description: >-
            Public browser or confidential server application. Editable through a versioned update;
            changing kind replaces credentials and revokes affected SSO user sessions.
        origin:
          $ref: '#/components/schemas/ApplicationOrigin'
        redirectUris:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
          description: Exact registered callback URLs within the application origin.
        postLogoutRedirectUris:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
          description: Exact permitted post-logout URLs within the application origin; may be empty.
        requiredPermissions:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        enabled:
          type: boolean
      required:
        - name
        - kind
        - origin
        - redirectUris
        - postLogoutRedirectUris
        - requiredPermissions
        - enabled
      x-runtime-refinement: >-
        Callback and logout URLs must use exactly origin, with no credentials, fragment, wildcard
        or backslash. Lists and required permissions must be unique. The application uses the
        authorization-code flow with PKCE S256; callers cannot enable machine credentials,
        implicit grants or unrestricted scopes through these settings.
    ApplicationSettings:
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
      unevaluatedProperties: false
      description: Complete creation settings. Client IDs, versions and credentials are server-generated.
    ApplicationUpdate:
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - type: object
          properties:
            version:
              $ref: '#/components/schemas/ApplicationVersion'
          required: [version]
      unevaluatedProperties: false
    ManagedApplication:
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - type: object
          properties:
            clientId:
              $ref: '#/components/schemas/ManagedApplicationClientId'
            version:
              $ref: '#/components/schemas/ApplicationVersion'
          required: [clientId, version]
      unevaluatedProperties: false
      description: Public managed application metadata. Contains no existing client secret.
    ApplicationListResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ManagedApplication'
        issuer:
          type: string
          format: uri
        discoveryUrl:
          type: string
          format: uri
        capabilities:
          type: object
          properties:
            manageApplications:
              type: boolean
              const: true
          required: [manageApplications]
          additionalProperties: false
      required: [applications, issuer, discoveryUrl, capabilities]
      additionalProperties: false
    ApplicationMutationResponse:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ManagedApplication'
        clientSecret:
          type: string
          minLength: 16
          description: Fresh confidential-client secret returned when changing from public to confidential.
      required: [application]
      additionalProperties: false
      if:
        properties:
          application:
            properties:
              kind:
                const: public
      then:
        not:
          required: [clientSecret]
    ApplicationCreatedResponse:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ManagedApplication'
        clientSecret:
          type: string
          minLength: 16
          description: Initial confidential-client secret. Later reads use the explicit reveal operation.
      required: [application]
      additionalProperties: false
      oneOf:
        - properties:
            application:
              properties:
                kind:
                  const: public
          not:
            required: [clientSecret]
        - properties:
            application:
              properties:
                kind:
                  const: confidential
          required: [clientSecret]
    ApplicationVersionRequest:
      type: object
      properties:
        version:
          $ref: '#/components/schemas/ApplicationVersion'
      required: [version]
      additionalProperties: false
    ApplicationSecretResponse:
      type: object
      properties:
        application:
          allOf:
            - $ref: '#/components/schemas/ManagedApplication'
            - properties:
                kind:
                  const: confidential
        clientId:
          $ref: '#/components/schemas/ManagedApplicationClientId'
        clientSecret:
          type: string
          minLength: 16
          description: Newly rotated confidential-client secret. Later reads use the explicit reveal operation.
      required: [application, clientId, clientSecret]
      additionalProperties: false
      x-runtime-refinement: Both client identifiers must equal the requested managed application ID.
    ApplicationSecretRevealResponse:
      type: object
      properties:
        clientId:
          $ref: '#/components/schemas/ManagedApplicationClientId'
        clientSecret:
          type: string
          minLength: 16
          description: The existing confidential-client credential, not a newly generated secret.
        version:
          $ref: '#/components/schemas/ApplicationVersion'
      required: [clientId, clientSecret, version]
      additionalProperties: false
      x-runtime-refinement: The client ID must match the path and the version must equal the requested current version.
    ApplicationDeletionResponse:
      type: object
      properties:
        clientId:
          $ref: '#/components/schemas/ManagedApplicationClientId'
        deleted:
          type: boolean
          const: true
      required: [clientId, deleted]
      additionalProperties: false
      x-runtime-refinement: The confirmed client ID must equal the requested managed application ID.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - error
    ApplicationAccessRule:
      type: object
      description: >-
        SCORE provider application-admission policy, not a URL routing or resource ACL rule.
        Each stable rule ID and client ID is unique within the catalogue. The client must already
        be an enabled OIDC authorization-code client without service accounts; protected identity-*
        and internal Keycloak clients cannot be targeted. Generated score-app-* clients are reserved for Applications. Every registered callback must be an
        exact URL on this one origin; multiple callback paths are allowed. A rule cannot take over
        a client token scope owned by a service contract. Provider application performs these live
        client and ownership checks, so a saved desired revision can subsequently fail application.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
          description: Stable rule identifier.
        clientId:
          type: string
          maxLength: 160
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
          description: Existing dedicated OIDC client; identity-*, score-app-* and internal Keycloak IDs are reserved.
        origin:
          type: string
          format: uri
          maxLength: 2048
          x-runtime-refinement: true
          description: >-
            One canonical exact HTTPS origin, with no trailing slash, path, wildcard, domain prefix,
            credentials, query or fragment. Explicit default ports are not canonical. HTTP localhost
            or 127.0.0.1 origins are accepted for local development; the provider restricts HTTP to
            the local environment. This field cannot express a distinct policy for an /admin path.
          examples:
            - https://sphere.score.us.es
            - http://localhost:18000
        requiredPermissions:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 150
            pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
          description: >-
            Known atomic catalogue permissions, all of which the live user must hold. The provider
            checks admission during initial authentication, including cookie SSO, and token issue
            and refresh. Managed client tokens are scoped to these atoms and include the client ID
            as an audience. The application must separately enforce its own route/resource policy.
      required:
        - id
        - clientId
        - origin
        - requiredPermissions
      additionalProperties: false
    CatalogueSchema:
      type: object
      properties:
        defaultRole:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)*$
          description:
            Optional registration default role. It must exist, remain unprivileged and cannot grant
            service access directly or through composed roles.
        permissions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 150
                pattern: ^[a-z][a-z0-9-]*(?::[a-z0-9-]+)+$
                x-runtime-refinement: true
              description:
                type: string
                maxLength: 500
                default: ''
            required:
              - name
            additionalProperties: false
          maxItems: 2000
          description: >-
            Additive atomic permission catalogue. Existing names, service namespace ownership and
            descriptions cannot change or be removed. New atoms require the current protected
            identity-administrator role and an application namespace. Reserved domains are identity,
            admin-web, account, account-console, admin-cli, broker, keycloak, realm-admin,
            realm-management, security-admin-console and system, plus identity-* and default-roles-*
