name: Publish verified Identity images

# Called by ci.yml only after verification of a push to main succeeds.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: identity-ghcr-main
  cancel-in-progress: false

jobs:
  release:
    name: Select verified main revision
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      prefix: ${{ steps.release.outputs.prefix }}
    steps:
      - name: Reject other events and skip superseded revisions
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ]]; then
            printf '::error::Only a verified push to main may publish images.\n'
            exit 1
          fi
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::A newer main revision exists; skipping publication of this superseded revision.\n'
            exit 0
          fi
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'publish=true\nprefix=ghcr.io/%s\n' "$image_repository" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: provider
            dockerfile: provider/Dockerfile
            target: provider
          - name: account
            dockerfile: deploy/Runtime.Dockerfile
            target: account
          - name: admin
            dockerfile: deploy/Runtime.Dockerfile
            target: admin
          - name: gateway
            dockerfile: deploy/Runtime.Dockerfile
            target: production-web
          - name: tooling
            dockerfile: deploy/Runtime.Dockerfile
            target: production-tooling
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags and provenance labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.release.outputs.prefix }}-${{ matrix.name }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=SCORETech Identity ${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=identity-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=identity-${{ matrix.name }}
      - name: Summarize published image
        shell: bash
        env:
          IMAGE: ${{ needs.release.outputs.prefix }}-${{ matrix.name }}
        run: |
          set -Eeuo pipefail
          printf '### %s\n\n- `%s:main`\n- `%s:sha-%s`\n' \
            "$IMAGE" "$IMAGE" "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Publish release and changelog
    needs: [release, publish]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source and changelog history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create source-bound release with incremental changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/publish-release.mjs
