# Docker service addresses can change when an API or the provider is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream score_account_api { zone score_account_api 64k; server account-api:8080 resolve; }
upstream score_admin_api { zone score_admin_api 64k; server admin-api:8080 resolve; }
upstream score_provider { zone score_provider 64k; server keycloak:8080 resolve; }
map $uri $score_identity_csp {
 default "";
 ~^/identity/(account|admin)/ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}
limit_req_zone $binary_remote_addr zone=score_identity:10m rate=30r/s;
server {
 listen 18000;
 server_name localhost;
 client_max_body_size 2m;
 access_log off;
 add_header Content-Security-Policy $score_identity_csp always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = / { return 302 /identity/account/; }
 location = /identity { return 302 /identity/account/; }
 location = /identity/ { return 302 /identity/account/; }
 location = /identity/account { return 308 /identity/account/; }
 location = /identity/admin { return 308 /identity/admin/; }
 location = /identity/account/config.js { alias /runtime/web/account.js; add_header Cache-Control no-store; }
 location = /identity/admin/config.js { alias /runtime/web/admin.js; add_header Cache-Control no-store; }
 location /identity/account/ { alias /usr/share/nginx/html/account/; try_files $uri $uri/ /identity/account/index.html; }
 location /identity/admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /identity/admin/index.html; }
 location = /identity/legal { return 302 /identity/legal/terms; }
 location = /identity/legal/ { return 302 /identity/legal/terms; }
 location = /identity/legal/terms/ { return 308 /identity/legal/terms; }
 location = /identity/legal/privacy/ { return 308 /identity/legal/privacy; }
 location = /identity/legal/terms { alias /runtime/web/legal/terms.html; default_type text/html; add_header Cache-Control 'no-cache'; }
 location = /identity/legal/privacy { alias /runtime/web/legal/privacy.html; default_type text/html; add_header Cache-Control 'no-cache'; }
 location /identity/legal/assets/ { alias /runtime/web/legal/assets/; }
 location /identity/api/account/ { proxy_pass http://score_account_api/; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
 location /identity/api/admin/ { proxy_pass http://score_admin_api/; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
 location ~ ^/identity/auth/realms/score/account(/|$) { return 404; }
 location ~ ^/identity/auth/realms/score/(score-catalogue|tentu-authorization|tentu-user-mutations|tentu-support|tentu-recovery/users|score-applications|score-identities)(/|$) { return 404; }
 location ~ ^/identity/auth/(realms/score/|resources/) {
  limit_req zone=score_identity burst=60 nodelay;
  limit_req_status 429;
  proxy_pass http://score_provider;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 # Compatibility endpoint for the existing US CAS service registration.
 location = /api/v1/users/auth/sso/us/callback {
  absolute_redirect off;
  # Re-enter the realm cookie path; validate CAS against the original stored service.
  add_header Cache-Control no-store always;
  add_header Referrer-Policy no-referrer always;
  return 302 /identity/auth/realms/score/broker/us-sso/endpoint$is_args$args;
 }
 location / { return 404; }
}
