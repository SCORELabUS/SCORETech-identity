<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img" aria-labelledby="passkey-title passkey-description">
  <title id="passkey-title">Acceso con passkey</title>
  <desc id="passkey-description">Un dispositivo con una huella y una llave representa la confirmación segura de tu identidad.</desc>
  <defs>
    <linearGradient id="device-surface" x1="76" y1="24" x2="160" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f4f7f4"/>
    </linearGradient>
  </defs>
  <g id="backdrop">
    <circle cx="120" cy="100" r="84" fill="#e3f6e9"/>
    <path d="M43 133a84 84 0 0 1 129-98M197 67a84 84 0 0 1-129 98" stroke="#afd5ba" stroke-linecap="round"/>
    <rect x="61" y="42" width="102" height="132" rx="18" transform="rotate(-12 61 42)" fill="#cce9d5"/>
  </g>
  <g id="device">
